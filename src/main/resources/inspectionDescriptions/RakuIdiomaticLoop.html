<p>Reports <code>while True</code> (or <code>while 1</code>), which Raku spells <code>loop</code>.</p>
<p>
    <code>loop</code> exists precisely for the unconditional case and says so without the
    reader having to evaluate a condition that never changes.
</p>
<pre><code>
while True {
    last if done();
}

# Correct
loop {
    last if done();
}
</code></pre>
