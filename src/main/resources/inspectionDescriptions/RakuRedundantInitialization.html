<html>
<body>
<p>Reports initialising an array or hash to an empty literal.</p>
<p>
    A declared <code>@</code> or <code>%</code> variable already starts out as an empty
    <code>Array</code> or <code>Hash</code>; assigning <code>()</code>, <code>[]</code> or
    <code>{}</code> to it achieves nothing.
</p>
<pre><code>
my @items = [];
my %index = {};

# Correct
my @items;
my %index;
</code></pre>
<!-- tooltip end -->
</body>
</html>
