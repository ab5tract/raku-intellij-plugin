pluginGroup = org.raku.comma

# The IntelliJ Platform provides the Kotlin stdlib at runtime; bundling our own
# copy alongside it causes classloader conflicts inside the IDE.
kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache=true

# Plugin 2.18.0's product-info-based classpath resolution pulls the bundled
# Vue.js plugin onto the test classpath even though we never declare it as a
# dependency; its VueLspServerActivationRule fails to initialize in the
# sandboxed test environment and breaks VFS teardown for every test.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=com.intellij.openRewrite,org.jetbrains.plugins.vue
