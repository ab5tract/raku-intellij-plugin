name: Release plugin zip

on:
  push:
    tags:
      # Version tags start with a digit, both the plain form (2026.2.13) and a
      # beta cut from a branch (2026.2--rakuast-viewer.7).
      #
      # This used to be "*beta*" alone, which was true of every tag back when
      # the version carried the word. It stopped being true when the branch
      # marker became `--name` instead of `-beta(name)`, and the failure is
      # completely silent: no workflow matches, so nothing is queued, nothing
      # fails, and no release appears. Keep these patterns and the version
      # format in step -- ReleaseWorkflowTest checks that they are.
      - "[0-9]*"
      # Legacy tags from before that change: v2.0-beta.31.
      - "*beta*"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    # A shallow checkout is fine: -PpluginVersion below short-circuits the
    # version lookup before it ever consults git.
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    # github.ref_name is the tag. github.event.release does NOT exist on a
    # push event -- this workflow triggers on `push: tags`, not on `release`
    # -- so the old `github.event.release.tag_name` expanded to the empty
    # string, the build ran with an empty -PpluginVersion, and the artifact
    # was named without any version at all.
    # The tag goes through the environment rather than being interpolated
    # straight into the command. A beta cut from a branch carries parentheses
    # -- 2026.2-beta(rakuast-viewer).3 -- which the shell reads as a subshell
    # and rejects with "syntax error near unexpected token `('". Quoting an
    # expanded variable is also what keeps a tag from being able to inject
    # shell in the first place.
    - name: Build with Gradle
      env:
        PLUGIN_VERSION: ${{ github.ref_name }}
      run: ./gradlew buildPlugin "-PpluginVersion=$PLUGIN_VERSION"

    - name: Check the artifact is named as expected
      env:
        PLUGIN_VERSION: ${{ github.ref_name }}
      run: |
        expected="raku-intellij-plugin_${PLUGIN_VERSION}.zip"
        if [ ! -f "build/distributions/$expected" ]; then
          echo "Expected build/distributions/$expected, but found:"
          ls -1 build/distributions/
          exit 1
        fi
        echo "Publishing $expected"

    - name: Press a release on GitHub with the downloadable .zip
      uses: ncipollo/release-action@v1
      with:
        draft: false
        allowUpdates: true
        artifacts: "build/distributions/*.zip"
        token: ${{ secrets.GITHUB_TOKEN }}
        # Likewise empty on a push event. Let the action generate notes from
        # the commits instead of publishing a blank body.
        generateReleaseNotes: true

